apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-service
  namespace: grupo5-tickets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-service
  template:
    metadata:
      labels:
        app: queue-service
    spec:
      containers:
        - name: queue-service
          image: martupiru/queue-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: USER_BD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PASSWORD_BD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/tickets
            - name: SPRING_DATA_REDIS_CLUSTER_NODES
              value: my-valkey-cluster-0.my-valkey-cluster-headless.default.svc.cluster.local:6379,my-valkey-cluster-1.my-valkey-cluster-headless.default.svc.cluster.local:6379,my-valkey-cluster-2.my-valkey-cluster-headless.default.svc.cluster.local:6379,my-valkey-cluster-3.my-valkey-cluster-headless.default.svc.cluster.local:6379,my-valkey-cluster-4.my-valkey-cluster-headless.default.svc.cluster.local:6379,my-valkey-cluster-5.my-valkey-cluster-headless.default.svc.cluster.local:6379
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-secret
                  key: SPRING_DATA_REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: queue-service
  namespace: grupo5-tickets
spec:
  type: ClusterIP
  selector:
    app: queue-service
  ports:
    - port: 8081
      targetPort: 8081
---
