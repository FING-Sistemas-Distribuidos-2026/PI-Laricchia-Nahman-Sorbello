services:
  queue_postgres:
    image: postgres:16
    container_name: queue_postgres
    environment:
      POSTGRES_DB: queue_db
      POSTGRES_USER: queue_user
      POSTGRES_PASSWORD: queue_pass
    ports:
      - "5432:5432"
    volumes:
      - ./docs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - queue_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue_user -d queue_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tickets_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  queue_postgres_data:
  redis_data: