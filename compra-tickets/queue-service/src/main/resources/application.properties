spring.application.name=queue-service
server.port=8081
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://localhost:5432/queue_db
spring.datasource.username=queue_user
spring.datasource.password=queue_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.task.scheduling.enabled=true

# URL del servicio aidis para leer system_parameters por HTTP
compra-service.url=http://localhost:8083