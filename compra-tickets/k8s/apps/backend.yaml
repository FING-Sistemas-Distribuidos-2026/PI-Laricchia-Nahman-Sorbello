apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: grupo5-tickets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: martupiru/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: QUEUE_SERVICE_URL
              value: http://queue-service:8081
            - name: PURCHASE_SERVICE_URL
              value: http://compra-service:8083
            - name: CORS_ALLOWED_ORIGINS
              value: "http://10.66.1.52"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: grupo5-tickets
spec:
  type: LoadBalancer
  loadBalancerIP: 10.66.1.51
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080